name: streaming-pipeline

networks:
  pipeline-net:
    driver: bridge

volumes:
  redpanda-data:
  minio-data:

services:

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9093
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9093:9093"   # Kafka API (accesso da host)
      - "8082:8082"   # Pandaproxy (REST)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    networks:
      - pipeline-net
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - pipeline-net
    entrypoint: >
      /bin/sh -c "
      rpk topic create events --brokers redpanda:9092 --partitions 3 --replicas 1 || true &&
      echo 'Topic events pronto'
      "

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/pipeline-data &&
      mc anonymous set download local/pipeline-data &&
      echo 'Bucket pipeline-data pronto'
      "

  producer:
    build:
      context: .
      dockerfile: ingestion/producer/Dockerfile
    container_name: producer
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: events
    ports:
      - "8000:8000"
    networks:
      - pipeline-net
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  load-generator:
    build:
      context: .
      dockerfile: ingestion/load_generator/Dockerfile
    container_name: load-generator
    environment:
      PRODUCER_URL: http://producer:8000
      EVENTS_PER_SECOND: "2"
    networks:
      - pipeline-net
    depends_on:
      producer:
        condition: service_healthy