[project]
name = "streaming-pipeline"
version = "0.1.0"
description = "E2E pipeline: Redpanda -> Producer HTTP -> Consumer -> MinIO (Parquet) -> DataFusion -> Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]

[dependency-groups]
load_generator = [
    "requests>=2.32.0",
    "faker>=30.0.0",
]
producer = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "confluent-kafka>=2.6.0",
    "pydantic>=2.9.0",
]
consumer = [
    "confluent-kafka>=2.6.0",
    "minio>=7.2.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
]
transformation = [
    "datafusion>=42.0.0",
    "pyarrow>=17.0.0",
]
viz = [
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "datafusion>=42.0.0",
]

[tool.uv]
package = false